name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "config/selectors.json"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch on-device embedding model and page-reading rules
        run: |
          mkdir -p app/src/main/assets
          cp config/selectors.json app/src/main/assets/selectors.json
          curl -fsSL --retry 3 -o app/src/main/assets/universal_sentence_encoder.tflite \
            https://storage.googleapis.com/mediapipe-models/text_embedder/universal_sentence_encoder/float32/latest/universal_sentence_encoder.tflite \
            || echo "Model download failed; the app falls back to its built-in embedder."

      - name: Run tests and build signed APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleRelease 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong|FAILED|Test.*>' -A2 build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Keep test reports with the log
        if: always()
        run: |
          mkdir -p /tmp/ci/tests
          find app/build/test-results -name '*.xml' -exec cp {} /tmp/ci/tests/ \; 2>/dev/null || true

      - name: Publish build log to ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/ci && cp build.log /tmp/ci/build.log 2>/dev/null || echo "no log" > /tmp/ci/build.log
          echo "${GITHUB_SHA} ${{ job.status }}" > /tmp/ci/status.txt
          cd /tmp/ci
          git init -q
          git checkout -q -b ci-logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -qm "Build log for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Cartwise.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Cartwise-apk
          path: Cartwise.apk

      - name: Publish "latest" release for easy phone download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Cartwise.apk --title "Cartwise build ${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA}. Install Cartwise.apk on your phone." --prerelease
