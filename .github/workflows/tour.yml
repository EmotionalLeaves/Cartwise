name: Emulator tour

# Push to the "tour" branch to run: installs Cartwise on an Android 14 emulator (dark mode),
# drives every screen against live Amazon, and publishes screenshots + logs to the tour-results branch.
on:
  push:
    branches: [tour]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tour
  cancel-in-progress: true

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch embedding model and rules
        run: |
          mkdir -p app/src/main/assets
          cp config/selectors.json app/src/main/assets/selectors.json
          curl -fsSL --retry 3 -o app/src/main/assets/universal_sentence_encoder.tflite \
            https://storage.googleapis.com/mediapipe-models/text_embedder/universal_sentence_encoder/float32/latest/universal_sentence_encoder.tflite || true

      - name: Build app and tour
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tail -30

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the tour on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell cmd uimode night yes
            adb shell settings put global hide_error_dialogs 1
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant com.emotionalleaves.cartwise android.permission.POST_NOTIFICATIONS || true
            adb logcat -c || true
            adb shell am instrument -w -e class com.emotionalleaves.cartwise.TourTest com.emotionalleaves.cartwise.test/androidx.test.runner.AndroidJUnitRunner > instrument.txt 2>&1 || true
            mkdir -p tour-out
            adb pull /sdcard/Android/data/com.emotionalleaves.cartwise/files/tour tour-out/ || true
            adb logcat -d -s Cartwise:V AndroidRuntime:E chromium:W System.err:W > tour-out/logcat.txt || true
            cp instrument.txt tour-out/ || true

      - name: Publish results to tour-results branch
        if: always()
        run: |
          mkdir -p /tmp/tr && cp -r tour-out/. /tmp/tr/ 2>/dev/null || echo "no results" > /tmp/tr/empty.txt
          echo "${GITHUB_SHA}" > /tmp/tr/commit.txt
          cd /tmp/tr
          git init -q && git checkout -q -b tour-results
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "Tour for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tour-results
